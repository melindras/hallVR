<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>A-Frame Mobile Movement</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Joystick -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-joystick-controls@1.0.1/dist/aframe-joystick-controls.min.js"></script>
</head>

<body>
  <a-scene>

    <!-- Player -->
    <a-entity
      id="player"
      position="0 1.6 0"
      joystick-controls="maxSpeed: 0.1"
    >

      <!-- Cámara -->
      <a-camera
        look-controls="magicWindowTrackingEnabled: true">
      </a-camera>

    </a-entity>

    <!-- Suelo -->
    <a-plane
      rotation="-90 0 0"
      width="100"
      height="100"
      color="#7BC8A4">
    </a-plane>

    <!-- Caja -->
    <a-box position="0 1 -5" color="red"></a-box>

  </a-scene>
</body>
</html>
