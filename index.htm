<!DOCTYPE html>
<html>
<head>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<!--
    <script src="https://melindras.github.io/hallVR/joystick.js"></script>
-->

<link rel="stylesheet" href="joystick.css">
</head>
<body>
<!-- JOYSTICK -->
<div id="joystick-container">
    <div id="base"></div>
    <div id="stick"></div>
</div>
    
<a-scene>
<a-assets>
<a-asset-item id= "Cubo de basura azul3" src= "Cubo de basura azul3.glb"></a-asset-item>
<a-asset-item id= "Cubos de basura amarillo40" src= "Cubos de basura amarillo40.glb"></a-asset-item>
<a-asset-item id= "mesaconserjes (3)" src= "mesaconserjes (3).glb"></a-asset-item>  
<a-asset-item id= "rueda_sdgs" src= "rueda_sdgs.glb"></a-asset-item>
<a-asset-item id= "asiento_cubos" src= "asiento_cubos.glb"></a-asset-item>    
</a-assets>
<!-- implementación de un joystick -->
    <a-entity
      id="player"
      position="0 1.6 0"
      joystick-controls="maxSpeed: 0.1"
    >

      <!-- Cámara -->
      <a-camera
        look-controls="magicWindowTrackingEnabled: true">
      </a-camera>

    </a-entity>
  
<a-entity gltf-model="#Cubo de basura azul3" position="-1 0 0" scale="1 1 1" rotation= 0 0 90></a-entity>
<a-entity gltf-model="#Cubos de basura amarillo40" position="3 0 0" scale="1 1 1" rotation= 0 0 90></a-entity>
<a-entity gltf-model="#mesaconserjes (3)" position="10 0 0" scale="1 1 1" rotation= 0 0 90></a-entity>  
<a-entity gltf-model="#rueda_sdgs" position="10 0 0" scale="1 1 1" color= "#FF0000" rotation= 0 0 90></a-entity>
    
<a-entity gltf-model="#asiento_cubos" position="15 0 0" scale="1 1 1" rotation= 0 0 90></a-entity> 
<a-plane position= "0 0 0" rotation= "-90 0 0" width= "60" height= "60" color= "#333230"></a-plane>
<a-sky color="#fcfcfc"></a-sky>
</a-scene>

<script>
    const stick = document.getElementById("stick");
const container = document.getElementById("joystick-container");
const player = document.getElementById("player");

let active = false;
let moveX = 0;
let moveY = 0;

const center = {
  x: 60,
  y: 60
};

container.addEventListener("pointerdown", () => {
  active = true;
});

window.addEventListener("pointerup", () => {
  active = false;

  stick.style.left = "30px";
  stick.style.top = "30px";

  moveX = 0;
  moveY = 0;
});

window.addEventListener("pointermove", (e) => {

  if (!active) return;

  const rect = container.getBoundingClientRect();

  let x = e.clientX - rect.left;
  let y = e.clientY - rect.top;

  let dx = x - center.x;
  let dy = y - center.y;

  const max = 40;

  const distance = Math.sqrt(dx*dx + dy*dy);

  if (distance > max) {
    dx = dx / distance * max;
    dy = dy / distance * max;
  }

  stick.style.left = `${dx + 30}px`;
  stick.style.top = `${dy + 30}px`;

  moveX = dx / max;
  moveY = dy / max;
});

const camera = document.querySelector("a-camera");

AFRAME.registerComponent("move-player", {

  tick: function () {

    if (moveX === 0 && moveY === 0) return;

    // Dirección hacia donde mira la cámara
    const direction = new THREE.Vector3();
    camera.object3D.getWorldDirection(direction);

    // Evitar movimiento vertical
    direction.y = 0;
    direction.normalize();

    // Vector lateral
    const right = new THREE.Vector3();
    right.crossVectors(direction, new THREE.Vector3(0, 1, 0)).normalize();

    // Velocidad
    const speed = 0.05;

    // Movimiento adelante/atrás
    player.object3D.position.add(
      direction.clone().multiplyScalar(moveY * speed)
    );

    // Movimiento lateral
    player.object3D.position.add(
      right.clone().multiplyScalar(-moveX * speed)
    );
  }
});

player.setAttribute("move-player", "");

    
</script>
    
</body>
</html>
