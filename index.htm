<!DOCTYPE html>
<html>
<head>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<script src="joystick.js"></script>
<link rel="stylesheet" href="joystick.css">
</head>
<body>
<!-- JOYSTICK -->
<div id="joystick-container">
    <div id="base"></div>
    <div id="stick"></div>
</div>
    
<a-scene>
<a-assets>
<a-asset-item id= "Cubo de basura azul3" src= "Cubo de basura azul3.glb"></a-asset-item>
<a-asset-item id= "Cubos de basura amarillo40" src= "Cubos de basura amarillo40.glb"></a-asset-item>
<a-asset-item id= "mesaconserjes (3)" src= "mesaconserjes (3).glb"></a-asset-item>  
</a-assets>
<!-- implementación de un joystick -->
    <a-entity
      id="player"
      position="0 1.6 0"
      joystick-controls="maxSpeed: 0.1"
    >

      <!-- Cámara -->
      <a-camera
        look-controls="magicWindowTrackingEnabled: true">
      </a-camera>

    </a-entity>
  
<a-entity gltf-model="#Cubo de basura azul3" position="-1 2.5 0" scale="10 10 10" rotation= 0 0 90></a-entity>
<a-entity gltf-model="#Cubos de basura amarillo40" position="10 2.5 0" scale="10 10 10" rotation= 0 0 90></a-entity>
<a-entity gltf-model="#mesaconserjes (3)" position="10 2.5 0" scale="10 10 10" rotation= 0 0 90></a-entity>  
<a-plane position= "0 0 0" rotation= "-90 0 0" width= "60" height= "60" color= "#333230"></a-plane>
<a-sky color="#fcfcfc"></a-sky>
</a-scene>
</body>
</html>
