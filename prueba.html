<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>A-Frame - Colisiones</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
</head>

<body>

<a-scene>
-
  <!-- Suelo -->
  <a-box
    class="colisionable"
    position="0 -0.5 0"
    width="20"
    height="1"
    depth="20"
    color="#7BC8A4">
  </a-box>

  <!-- Pared -->
  <a-box
    class="colisionable"
    position="0 1.5 -5"
    width="10"
    height="3"
    depth="1"
    color="red">
  </a-box>

  <!-- Jugador -->
  <a-entity id="player" position="0 1.6 5">

    <a-camera
      wasd-controls
      look-controls
      raycaster="objects: .colisionable; far: 1">

      <a-entity cursor="fuse: false"></a-entity>

    </a-camera>

  </a-entity>

</a-scene>

<script>

AFRAME.registerComponent('collision-handler', {

  init: function () {

    const camera = document.querySelector('a-camera');

    camera.addEventListener('raycaster-intersection', function (event) {

      console.log("Colisión detectada");

      // Detener avance
      camera.components["wasd-controls"].keys["KeyW"] = false;

    });

  }

});

// Añadir componente al cargar
document.querySelector('a-scene').addEventListener('loaded', () => {

  const player = document.querySelector('#player');

  player.setAttribute('collision-handler', '');

});

</script>

</body>
</html>
