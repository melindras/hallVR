<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>A-Frame Físicas - Kinematic Body</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
</head>
<body>
  <a-scene physics="gravity: -9.8; debug: false">

    <a-sky color="#ECECEC"></a-sky>

    <a-box static-body
           position="0 -0.5 0"
           width="20"
           height="1"
           depth="20"
           color="#7BC8A4">
    </a-box>

    <a-box static-body
           position="0 1.5 -5"
           width="10"
           height="3"
           depth="1"
           color="red">
    </a-box>

    <a-entity id="player"
              movement-controls="controls: keyboard"
              kinematic-body="radius: 0.5; height: 1.6"
              position="0 0 5">
      <a-camera look-controls position="0 1.6 0"></a-camera>
    </a-entity>

  </a-scene>
</body>
</html>
