<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>A-Frame - Colisiones por Raycast Infalibles</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls/dist/aframe-blink-controls.min.js"></script>
  <script src="https://rawgit.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
</head>
<body>

  <a-scene>
    <a-sky color="#92e8a9"></a-sky>

    <a-box class="colisionable"
           position="0 -0.5 0"
           width="20"
           height="1"
           depth="20"
           color="#7BC8A4">
    </a-box>

    <a-box class="colisionable"
           position="0 1.5 -5"
           width="10"
           height="3"
           depth="1"
           color="red">
    </a-box>

    <a-entity id="player" position="0 0 5">
      <a-camera wasd-controls="acceleration: 65" 
                look-controls 
                raycaster="objects: .colisionable; far: 1.5; showLine: false">
        
        <a-entity id="colision-script" script-colision></a-entity>
      </a-camera>
    </a-entity>

  </a-scene>

  <script>
    AFRAME.registerComponent('script-colision', {
      init: function () {
        var el = this.el;
        var cameraEl = el.closest('a-camera');
        
        // Cuando el raycaster detecta un objeto cerca (la pared)
        cameraEl.addEventListener('raycaster-intersection', function (evt) {
          // Guardamos la posición justo antes de chocar
          var currentPosition = cameraEl.getAttribute('position');
          // Empujamos levemente al jugador hacia atrás para que no traspase
          cameraEl.components['wasd-controls'].keys['KeyW'] = false; // Detiene la marcha hacia adelante
        });
      }
    });
  </script>

</body>
</html>
